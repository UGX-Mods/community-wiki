# External link check with lychee (https://lychee.cli.rs), run weekly by .github/workflows/links.yml
# Internal links (pages, assets, anchors) are checked by `npm run validate`.
# Local run: lychee --config lychee.toml './**/*.html' './**/*.md'

no_progress = true

# only external links, internal ones are validated by npm run validate
scheme = ["https", "http"]
include_verbatim = false

# internal links (/UGXL, /attachments/...) resolve to the wiki and are excluded
# below; without a base lychee reports every root-relative link as an error
base_url = "https://wiki.ugx-mods.com/"

max_concurrency = 8
max_retries = 2
retry_wait_time = 5
timeout = 20

# 403: many hosts block bots (Cloudflare etc.), 429: rate limited (imgur), not dead
accept = ["200..=299", "403", "429"]

exclude = [
  # the wiki itself: internal links are checked by npm run validate
  '^https?://wiki\.ugx-mods\.com',
  # Jira Cloud needs a login
  '^https?://ugxmods\.atlassian\.net',
  # need a login: forum profile areas, launcher download (closed beta)
  '^https?://(www\.)?ugx-mods\.com/forum/profile/',
  '^https?://(www\.)?ugx-mods\.com/(play/ugx_launcher|ugxl)/',
  '^https?://(localhost|127\.0\.0\.1)',
]

# wiki.js re-export of the GitHub templates (.github is skipped by default), packages
# and build output of local runs; both separators, so local runs on Windows work too
exclude_path = ['(^|[/\\])(github|node_modules|dist)[/\\]']
