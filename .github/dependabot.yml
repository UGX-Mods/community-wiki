# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # give the ecosystem 3 days to spot compromised / broken releases (same as min-release-age in .npmrc)
    cooldown:
      default-days: 3
    # keep the exact pins in package.json (see save-exact in .npmrc)
    versioning-strategy: increase
    ignore:
      # the types follow the oldest Node.js major allowed by devEngines in package.json
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # one PR for all minor & patch updates instead of one per package
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
