name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, validate & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions are pinned to commit SHAs, dependabot keeps them (and the comments) up to date
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # binaries (images, videos) are not needed for checks, pointers are enough
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # install scripts are governed by "allowScripts" in package.json (strict, see .npmrc)
      - run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      # wiki.js commits page edits directly to main without prettier formatting,
      # so only the files touched by the pull request are format-checked
      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            git ls-files > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"

      - name: Prettier (changed files)
        run: |
          xargs -r -d '\n' npx --no-install prettier --check --ignore-unknown \
            --no-error-on-unmatched-pattern < "$RUNNER_TEMP/changed.txt"

      - name: Stylelint
        run: npm run lint:style

      # all pages, so removed/renamed pages are caught in links of unchanged pages
      - name: Validate pages (links, security, metadata)
        run: npm run validate

      - name: Build theme assets
        run: npm run build
