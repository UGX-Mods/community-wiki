name: PR title

# pull requests are squash merged, so the PR title becomes the commit message on main
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit title, e.g. 'docs(content): add guide for xyz' (https://www.conventionalcommits.org/)"
            exit 1
          fi
