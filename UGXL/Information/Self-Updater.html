<p>
  As soon as there is a new version out, you
  <strong>have to update</strong>
  the UGX Launcher to actually use it again.
</p>
<p>
  <a
    href="/attachments/ugxl/information/self-updater/self-updater.png"
    target="_blank">
    <img
      src="/attachments/ugxl/information/self-updater/self-updater.png"

  </a>
</p>
<p>&nbsp;</p>
<p>It will download &amp; install the update.</p>
<h2 id="SelfUpdater-Aftertheupdate">After the update</h2>
<p>
  The UGX Launcher will restart itself and you can enjoy the new version. 😉
</p>
